<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tower — prototype 9</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Archivo:wght@400;500;600&display=swap');
:root{--ink:#13161b;--stone:#1b1f26;--slate:#2a303a;--chalk:#c7c6c0;--dim:#7b8089;
      --candle:#e2a95c;--moss:#8a9b74;--rust:#b8705a;--sky:#7f9aad;--violet:#9c8bb0;
      --p0:#8b9099;--p1:#7fb6cc;--p2:#5f83cc;--p3:#c07fb4;--p4:#c96a58;--p5:#e2a95c;
      --serif:'Spectral',Georgia,serif;--sans:'Archivo',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--chalk);font-family:var(--serif);
     font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.page{max-width:900px;margin:0 auto;padding:0 20px 100px}

/* ---- status + nav ---- */
.status{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid var(--slate)}
.status .in{max-width:900px;margin:0 auto;padding:11px 20px 0;display:flex;gap:15px;align-items:baseline;flex-wrap:wrap;
            font-family:var(--sans);font-size:12px;color:var(--dim)}
.status b{font-family:var(--serif);font-size:18px;font-weight:400;color:var(--chalk)}
.status .c b{color:var(--candle)}.status .i b{color:var(--sky)}.status .r b{color:var(--moss)}
.status .s.full{color:var(--rust)}
.me{font-family:var(--serif);font-size:15px;color:var(--chalk)}
.madlib{max-width:900px;margin:0 auto;padding:2px 20px 6px;font-family:var(--serif);font-style:italic;
        font-size:13px;color:var(--dim)}
.speed{margin-left:auto;display:flex;gap:4px}
.speed button{background:none;border:1px solid var(--slate);color:var(--dim);font-size:11px;padding:2px 7px;cursor:pointer}
.speed button.on{border-color:var(--candle);color:var(--candle)}
nav{max-width:900px;margin:0 auto;padding:8px 20px 0;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
           font-family:var(--sans);font-size:13px;padding:8px 12px;cursor:pointer;white-space:nowrap;position:relative}
nav button:hover{color:var(--chalk)}
nav button.on{color:var(--candle);border-bottom-color:var(--candle)}
nav button .dot{position:absolute;top:5px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--candle)}

h1{font-family:var(--serif);font-size:26px;font-weight:300;margin:26px 0 4px}
.sub{color:var(--dim);font-size:15px;margin:0 0 22px;max-width:58ch}
h2{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--dim);margin:26px 0 10px;letter-spacing:.02em}

/* ---- door ---- */
.door{border-left:2px solid var(--candle);padding:2px 0 2px 18px;margin-top:24px}
.who{font-family:var(--sans);font-size:12px;color:var(--dim);margin-bottom:4px}
.asks{font-size:20px;font-weight:300;line-height:1.45;margin:0;max-width:52ch}
.quiet{border-left-color:var(--slate)}
.quiet .asks{color:var(--dim);font-style:italic;font-size:17px}
.clock{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-family:var(--sans);font-size:12px;color:var(--dim);flex-wrap:wrap}
.pips{display:flex;gap:5px}
.pip{width:9px;height:9px;border:1px solid var(--slate);border-radius:50%}
.pip.spent{background:var(--rust);border-color:var(--rust)}
.pip.bonus{border-color:var(--moss)}
.judged{color:var(--moss)}.judged.bad{color:var(--rust)}
.needs{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 0}
.need{font-family:var(--sans);font-size:12px;padding:5px 11px;border:1px solid var(--slate);color:var(--dim)}
.need.known{border-color:var(--candle);color:var(--candle)}
.need.met{background:var(--candle);color:var(--ink)}
.need.hidden{font-style:italic}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 0}
.q{font-size:14px;font-style:italic;background:none;border:1px solid var(--slate);color:var(--chalk);padding:8px 13px;cursor:pointer}
.q.insight{font-style:normal;font-family:var(--sans);font-size:13px;border-color:var(--sky);color:var(--sky)}
.q.free{font-style:normal;font-family:var(--sans);font-size:13px;border-color:var(--violet);color:var(--violet)}
.q.turn{font-style:normal;font-family:var(--sans);font-size:13px;border-color:var(--rust);color:var(--rust);margin-left:auto}
.q:hover:not(:disabled){border-color:var(--candle);color:var(--candle)}
.q.turn:hover:not(:disabled){border-color:var(--rust);color:var(--rust);background:rgba(184,112,90,.08)}
.q:disabled{opacity:.26;cursor:default;font-style:normal}
.said{font-size:15px;color:var(--moss);margin:9px 0 0;max-width:56ch;font-style:italic}
.said b{color:var(--candle);font-style:normal;font-weight:400}

/* ---- shared ---- */
.card{border:1px solid var(--slate);background:var(--stone);padding:14px 16px;margin:14px 0}
.card .t{font-size:16px;margin-bottom:9px}
.card .t span{color:var(--dim);font-family:var(--sans);font-size:11px;float:right}
.bar{height:3px;background:var(--slate)}.bar i{display:block;height:100%;background:var(--candle)}
.note-p{font-size:14px;color:var(--dim);margin:0 0 12px;max-width:60ch}

.bench{display:flex;gap:9px;margin:12px 0 10px;flex-wrap:wrap}
.slot{flex:1 1 0;min-width:110px;min-height:66px;border:1px dashed var(--slate);background:none;color:var(--dim);
      font-size:14px;padding:9px;text-align:left;line-height:1.3}
.slot.full{border-style:solid;background:var(--stone);color:var(--chalk);cursor:pointer}
.tags{display:block;font-family:var(--sans);font-size:10px;color:var(--dim);margin-top:5px}
.tags b{color:var(--candle);font-weight:400}
.tags i{color:#39404b;font-style:normal}
.shelf{display:flex;flex-wrap:wrap;gap:8px}
.mat{font-size:14px;background:var(--stone);color:var(--chalk);border:1px solid var(--slate);
     border-left-width:3px;padding:7px 11px;cursor:pointer;text-align:left;line-height:1.25}
.mat:hover:not(:disabled){border-color:var(--candle)}
.mat:disabled{opacity:.35;cursor:default}
.mat.unknown{border-top-style:dashed;border-right-style:dashed;border-bottom-style:dashed}
.mat.sel{background:#2a313c;border-color:var(--candle)}
.mat .n{color:var(--dim);font-family:var(--sans);font-size:11px}
.mat .study{display:inline-block;margin-left:8px;font-family:var(--sans);font-size:10px;color:var(--sky);
            border:1px solid var(--sky);padding:1px 5px;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--sans);font-size:10px;color:var(--dim);margin-top:12px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px}
.filt{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.filt button{background:none;border:1px solid var(--slate);color:var(--dim);
             font-family:var(--sans);font-size:11px;padding:3px 9px;cursor:pointer}
.filt button.on{border-color:var(--candle);color:var(--candle)}

.go{font-family:var(--sans);font-size:14px;font-weight:500;background:var(--candle);color:var(--ink);border:0;padding:11px 22px;cursor:pointer}
.go:disabled{background:var(--slate);color:var(--dim);cursor:default}
.ghost{font-family:var(--sans);font-size:13px;background:none;border:1px solid var(--slate);color:var(--dim);padding:10px 14px;cursor:pointer;margin-left:7px}
.ghost:hover:not(:disabled){border-color:var(--dim);color:var(--chalk)}
.ghost:disabled{opacity:.33;cursor:default}

.outcome{margin-top:16px;padding:15px 17px;background:var(--stone);border-top:2px solid var(--slate);position:relative}
.outcome.remembered{border-top-color:var(--candle)}.outcome.talked{border-top-color:var(--moss)}
.outcome.turned{border-top-color:var(--rust)}
.outcome p{margin:0 0 9px;max-width:58ch}.outcome p:last-child{margin:0}
.named{font-size:19px;font-weight:600;color:var(--candle)}
.gain{font-family:var(--sans);font-size:12px;color:var(--dim)}.gain b{color:var(--moss);font-weight:400}
.learned{font-family:var(--sans);font-size:12px;color:var(--sky)}
.x{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;line-height:1}
.x:hover{color:var(--chalk)}

/* ---- search ---- */
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.place{border:1px solid var(--slate);background:none;color:var(--chalk);padding:11px 13px;cursor:pointer;text-align:left}
.place:hover{border-color:var(--candle)}
.place.on{border-color:var(--candle);background:var(--stone)}
.place b{font-weight:400;font-size:15px}
.place span{display:block;font-family:var(--sans);font-size:11px;color:var(--dim);margin-top:5px;line-height:1.5}
.tapzone{margin-top:18px;border:1px solid var(--slate);background:var(--stone);padding:20px;text-align:center}
.tapbtn{width:100%;background:var(--slate);border:0;color:var(--chalk);font-family:var(--sans);font-size:16px;
        padding:26px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tapbtn:active{background:var(--candle);color:var(--ink)}
.tapbtn:disabled{opacity:.4;cursor:default}
.finds{margin-top:14px;font-size:14px;color:var(--dim);min-height:1.6em}
.finds b{color:var(--chalk);font-weight:400}
.cooldown{margin-top:10px;font-family:var(--sans);font-size:11px;color:var(--dim)}

/* ---- workshop ---- */
.stack{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--slate);
       padding:10px 13px;margin-bottom:7px;background:var(--stone);flex-wrap:wrap}
.stack .l{font-size:15px;flex:1;min-width:150px}
.stack .l small{display:block;font-family:var(--sans);font-size:11px;color:var(--dim)}
.stack .arrow{color:var(--dim);font-family:var(--sans);font-size:12px}
.stack .qbox{display:flex;align-items:center;gap:4px}
.stack .qbox button{background:none;border:1px solid var(--slate);color:var(--dim);
                    font-family:var(--sans);width:26px;height:26px;cursor:pointer;font-size:14px}
.stack .qbox input{background:var(--ink);color:var(--chalk);border:1px solid var(--slate);
                   font-family:var(--sans);font-size:13px;padding:3px;width:40px;text-align:center}

/* ---- lists ---- */
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--stone);
      color:var(--chalk);font-size:15px;padding:11px 0;line-height:1.35}
.item span{display:block;font-family:var(--sans);font-size:11px;color:var(--dim)}
.item.buy{cursor:pointer}.item.buy:hover:not(:disabled){color:var(--candle)}
.item:disabled{color:var(--dim);cursor:default}
.item.on{color:var(--candle)}
.item .price{float:right;font-family:var(--sans);font-size:12px;color:var(--candle)}
.item .price.no{color:#4a515c}

/* ---- rooms / floors ---- */
.floor{border:1px solid var(--slate);padding:12px 14px;margin-bottom:12px;background:var(--stone)}
.floor .fh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.floor .fh b{font-family:var(--serif);font-weight:400;font-size:15px;color:var(--chalk)}
.floor .fh span{font-family:var(--sans);font-size:11px;color:var(--dim)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.room{border:1px solid var(--slate);padding:11px 12px;background:var(--ink)}
.room .rh{font-family:var(--sans);font-size:11px;color:var(--dim);margin-bottom:6px}
.room select{background:var(--ink);color:var(--chalk);border:1px solid var(--slate);font-family:var(--serif);
             font-size:14px;padding:5px;width:100%;margin-bottom:5px}
.room .eff{font-size:12px;color:var(--moss);line-height:1.35}

/* ---- notebook ---- */
.nb .grp{font-family:var(--sans);font-size:11px;color:var(--dim);margin:22px 0 7px}
.nb .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--stone);font-size:14px;align-items:center}
.nb .row .v{font-family:var(--sans);font-size:11px;color:var(--dim);text-align:right;flex-shrink:0}
.nb .row .study-btn{background:none;border:1px solid var(--sky);color:var(--sky);
                    font-family:var(--sans);font-size:10px;padding:2px 7px;cursor:pointer;margin-left:8px}
.nb .row .study-btn:disabled{opacity:.3;cursor:default}
.nb .row.un{color:var(--dim)}
.nb .lore{color:var(--moss);font-size:14px;padding:6px 0;border-bottom:1px solid var(--stone)}
.nb .lore.un{color:#39404b;font-style:italic}
.study-now{border:1px solid var(--sky);background:var(--stone);padding:12px 14px;margin:14px 0}
.study-now .t{font-family:var(--sans);font-size:11px;color:var(--sky);margin-bottom:6px}
.study-now .n{font-size:15px;margin-bottom:8px}
.study-now .props{font-family:var(--sans);font-size:12px;color:var(--dim);margin-bottom:8px}
.study-now .props b{color:var(--chalk);font-weight:400}
.study-now .props i{color:#39404b;font-style:normal}

.rum{border-bottom:1px solid var(--stone);padding:12px 0}
.rum .t{color:var(--candle);font-size:16px}
.rum .d{font-size:14px;color:var(--dim);margin-top:3px}
.rum .m{font-family:var(--sans);font-size:10px;color:#39404b;margin-top:4px}

.empty-txt{color:var(--dim);font-style:italic;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.sl{border:1px solid var(--slate);padding:10px}
.sl b{display:block;font-family:var(--sans);font-size:10px;color:var(--dim);font-weight:400;margin-bottom:5px}
.sl select{background:var(--ink);color:var(--chalk);border:1px solid var(--slate);font-family:var(--serif);font-size:14px;padding:5px;width:100%}
input.nm{background:var(--ink);color:var(--chalk);border:1px solid var(--slate);font-family:var(--serif);font-size:16px;padding:8px 11px;width:100%;max-width:340px}

.logbox ol{margin:8px 0 0;padding:0;list-style:none;max-height:190px;overflow-y:auto}
.logbox li{font-size:14px;color:var(--dim);padding:4px 0;line-height:1.5}
.logbox li:first-child{color:var(--chalk)}

/* ---- character creator overlay ---- */
.creator{position:fixed;inset:0;background:var(--ink);z-index:100;overflow-y:auto}
.creator .in{max-width:640px;margin:0 auto;padding:40px 22px 80px}
.creator h1{font-size:30px;margin:0 0 6px;font-weight:300}
.creator .lede{color:var(--dim);font-style:italic;font-size:15px;max-width:52ch;margin:0 0 32px}
.creator h2{margin-top:28px}
.loc{border:1px solid var(--slate);padding:14px 16px;margin-bottom:9px;background:var(--stone);cursor:pointer;text-align:left;width:100%;color:var(--chalk);font-family:var(--serif);font-size:15px;line-height:1.5}
.loc.on{border-color:var(--candle);background:#2a313c}
.loc:hover{border-color:var(--candle)}
.loc b{font-weight:400;font-size:16px;display:block;margin-bottom:4px;color:var(--candle)}
.loc.on b{color:var(--candle)}
.loc span{font-family:var(--sans);font-size:12px;color:var(--dim);display:block;margin-top:5px}
.summary{border-left:2px solid var(--candle);padding:10px 0 10px 16px;margin:26px 0;font-style:italic;color:var(--chalk);font-size:15px;line-height:1.6}
.begin{margin-top:24px}
</style>

<div id="creator-mount"></div>
<div class="status" id="stbar" hidden>
  <div class="in" id="status"></div>
  <div class="madlib" id="madlib"></div>
  <nav id="nav"></nav>
</div>
<div class="page" id="page" hidden></div>

<script>
/* ============================================================
   THE TOWER — prototype 9

   Changes over v8:
   - Character creator on first load: name, starting location,
     wider vanity kit, choose-one-of-three curio.
   - Madlib line under status bar.
   - Tier progression: shack → cottage → tower → spire.
     Rooms are grouped by floor. Tier gates room count.
   - Rumour-then-coin upgrades: renown unlocks the offer,
     coin commissions the work at the builder.
   - Town replaces Books tab. Bookseller + builder inside.
   - Reading moves to Notebook (background track still runs
     anywhere; you set the book from Notebook).
   - Notebook: inline study buttons per material, current
     study card up top with what is/isn't uncovered.
   - Workshop: combine batching (queue N batches per stack),
     tier filters, combine reveals unknown input properties.
   - Search: 1-second cooldown per tap, visible bar.
     Tap handler no longer redraws the shelf per tap
     (fixes the click-eating lag).
   - Nav dot on Door/Search/Notebook when idle+actionable.
   - Turning a caller away costs 1 renown, with dialog.
   ============================================================ */

const MIN=60000;
const T={callerBase:3.2*MIN,callerFloor:1.0*MIN,study:1.5*MIN,ponder:3.0*MIN,
         grow:9*MIN,trickle:14*MIN,broom:5*MIN};
const SEARCH_CD_MS=1000;
const INTUIT_COST=3, BASE_STORE=14;

const POT=[{n:'',c:'--p0',lab:'common'},{n:'Strong ',c:'--p1',lab:'strong'},
  {n:'Concentrated ',c:'--p2',lab:'concentrated'},{n:'Distilled ',c:'--p3',lab:'distilled'},
  {n:'Quintessence of ',c:'--p4',lab:'quintessential'},{n:'Perfected ',c:'--p5',lab:'perfect'}];
const ALLTAGS=['bitter','green','drawing','earth','damp','binding','glass','light','seeing',
  'word','warm','soft','dark','quickening','metal','clear','washing'];

const BASE=[
  {id:'nettle',name:'dried nettle', tags:['bitter','green','drawing'],sow:1},
  {id:'clay',  name:'river clay',   tags:['earth','damp','binding']},
  {id:'lens',  name:'cracked lens', tags:['glass','light','seeing']},
  {id:'quill', name:'goose quill',  tags:['word','light','seeing']},
  {id:'wax',   name:'beeswax stub', tags:['warm','soft','binding']},
  {id:'crow',  name:'crow feather', tags:['dark','light','seeing']},
  {id:'plum',  name:'sour plum',    tags:['bitter','quickening','soft'],sow:1},
  {id:'iron',  name:'iron filings', tags:['metal','dark','binding']},
  {id:'note',  name:'marginal note',tags:['word','seeing','bitter']},
  {id:'rain',  name:'rainwater',    tags:['damp','clear','washing']},
  {id:'moth',  name:'moth wing',    tags:['dark','soft','light']},
  {id:'salt',  name:'salt',         tags:['bitter','clear','washing']},
  {id:'thyme', name:'wild thyme',   tags:['green','warm','quickening'],sow:1},
  {id:'string',name:'waxed string', tags:['binding','soft','earth']},
  {id:'honey', name:'dark honey',   tags:['warm','soft','quickening']},
  {id:'ash',   name:'hearth ash',   tags:['earth','dark','washing']},
  {id:'rue',   name:'bitter rue',   tags:['bitter','green','washing'],sow:1},
  {id:'poppy', name:'poppy head',   tags:['dark','soft','drawing'],sow:1},
];
const NOUN={nettle:'Nettle',clay:'Clay',lens:'Glass',quill:'Quill',wax:'Wax',crow:'Feather',
  plum:'Plum',iron:'Iron',note:'Marginalia',rain:'Rainwater',moth:'Moth',salt:'Salt',
  thyme:'Thyme',string:'Cord',honey:'Honey',ash:'Ash',rue:'Rue',poppy:'Poppy'};

function parseId(id){const[b,p]=id.split('@');return{b,p:p?+p:0};}
function extraTags(b,p){const base=BASE.find(m=>m.id===b);let seed=0;
  for(const ch of b)seed+=ch.charCodeAt(0);
  const avail=ALLTAGS.filter(t=>!base.tags.includes(t)),out=[];
  for(let i=0;i<p;i++)out.push(avail[(seed*7+i*13+seed%5)%avail.length]);
  return[...new Set(out)];}
function item(id){const{b,p}=parseId(id),base=BASE.find(m=>m.id===b);
  return{id,b,p,name:POT[p].n+base.name,tags:[...base.tags,...extraTags(b,p)],col:POT[p].c};}

/* Places: each starting location determines which places you can search.
   Every location has three of the six places available at start. */
const PLACES=[
  {id:'garden',name:'the kitchen garden',mats:['nettle','thyme','plum','honey']},
  {id:'ditch', name:'the ditch below',   mats:['clay','ash','moth','crow']},
  {id:'river', name:'the river stones',  mats:['rain','salt','iron','clay']},
  {id:'desk',  name:'your own drawers',  mats:['quill','note','lens','string']},
  {id:'hearth',name:'the cold hearth',   mats:['wax','ash','honey','string']},
  {id:'waste', name:'the burnt waste',   mats:['rue','poppy','ash','iron']},
];

const START_LOCATIONS=[
  {id:'village',name:'the edge of the low village',
   flavour:'A shack behind a hedgerow. The village will notice you by winter.',
   places:['garden','desk','hearth'],startShelf:['nettle','wax','honey'],
   startLore:{wax:['warm','soft','binding'],honey:['warm','soft','quickening']}},
  {id:'woods',name:'the woods above',
   flavour:'A shack under branches. Trouble walks up to your door because there is nowhere else.',
   places:['garden','ditch','desk'],startShelf:['nettle','thyme','moth'],

/* ---------- loop ---------- */
function simulate(s,dtReal){
  const dt=dtReal*s.speed;
  s.trickle+=dt;
  while(s.trickle>=T.trickle){s.trickle-=T.trickle;give(pick(BASE).id);}
  if(hasFix('broom')){s.broomT+=dt;while(s.broomT>=T.broom){s.broomT-=T.broom;s.insight+=1;}}
  s.rooms.forEach(r=>{if(r.fn==='garden'&&r.sown){r.grown+=dt;
    if(r.grown>=T.grow){give(r.sown,hasFix('hoe')?3:2);r.grown=0;}}});
  if(s.activeBook){const b=bk(s.activeBook);s.bookProg+=dt;
    if(s.bookProg>=readMin(b)*MIN)finishBook(s);}
  if(s.doing){s.doing.elapsed+=dt;if(s.doing.elapsed>=s.doing.dur)finishOcc(s);}
  if(s.searchCd>0){s.searchCd-=dtReal;if(s.searchCd<0)s.searchCd=0;}
  if(!s.supplicant){s.knockIn-=dt;
    if(s.knockIn<=0){s.supplicant=nextCaller();s.used=0;s.asked=[];s.said=[];s.orbUsed=false;
      s.knockIn=callerWait();note('Someone is on the stair.');dirty();}}
  /* Tier offer check */
  const nx=nextTier();
  if(nx && !s.tierOffered && s.rep>=nx.reqRep){s.tierOffered=true;
    note(nx.rumour);note(`\u2014 the builder at Town will take the work. ${nx.coin} coin.`);dirty();}
  return s;}
function finishBook(s){
  const b=bk(s.activeBook);s.readBooks.push(b.id);s.activeBook=null;s.bookProg=0;
  if(b.kind==='treatise'){if(!knows(b.teaches))s.troubles.push(b.teaches);
    note(`You finish ${b.title}. ${TROUBLES[b.teaches].lore}`);s.insight+=2;}
  else if(b.kind==='herbal'){b.mats.forEach(id=>s.lore[id]=[...BASE.find(m=>m.id===id).tags]);
    note(`You finish ${b.title}. You know ${b.mats.map(id=>BASE.find(m=>m.id===id).name).join(', ')} properly now.`);s.insight+=2;}
  else{s.insight+=1;note(`You finish ${b.title}. ${pick(THOUGHTS)} (+1 insight)`);}
  dirty();}
function finishOcc(s){
  const d=s.doing;s.doing=null;
  if(d.kind==='study'){const it=item(d.target),un=it.tags.filter(t=>!knownTags(d.target).includes(t));
    if(un.length){const t=pick(un);S.lore[it.b]=[...knownTags(d.target),t];
      note(`You turn the ${it.name} over for an hour. It is ${t}.`);}
    else note(`Nothing further from the ${it.name}.`);
    s.insight+=1;}
  if(d.kind==='ponder'){s.insight+=3;note(pick([
    'You sit with it until the shape of the thing comes clear. Nothing happened. Something changed.',
    'An hour at the window. You could not say what you worked out, but you worked something out.']));}
  dirty();}
function nextCaller(){
  const w=SUPPLICANTS.map(sp=>1+S.rumours.filter(r=>r.trouble===sp.trouble).length*1.5);
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return SUPPLICANTS[i];}
  return SUPPLICANTS[0];}

    ${n?'<button class="ghost" onclick="clearBench()">Put it back</button>':''}</div>`;
  h+='<div id="outcomeWrap">'+outcomeHTML()+'</div>';
  h+='<h2>Things you have to hand</h2>'+shelfHTML(id=>`place('${id}')`,S.bench.length>=3);
  h+=`<h2>What has been happening</h2><div class="logbox">
    <button class="ghost" style="margin:0 0 6px 0" onclick="clearLog()">Clear</button>
    <ol>${S.log.map(l=>`<li>${l}</li>`).join('')}</ol></div>`;
  return h;}

function pageSearch(){
  const p=S.searchAt?PLACES.find(x=>x.id===S.searchAt):null;
  const places=availPlaces();
  let h=`<h1>Out looking</h1><p class="sub">Pick somewhere and turn something up. One find per click,
    a moment between each. Each location lists what you might find there.</p>
    <div class="places">${places.map(pl=>`<button class="place ${S.searchAt===pl.id?'on':''}" onclick="setPlace('${pl.id}')">
      <b>${cap(pl.name)}</b><span>${pl.mats.map(m=>cap(BASE.find(x=>x.id===m).name)).join(' \u00b7 ')}</span></button>`).join('')}</div>`;
  if(p){
    const cdPct=S.searchCd>0?(1-S.searchCd/SEARCH_CD_MS)*100:100;
    h+=`<div class="tapzone">
    <div class="bar" style="margin-bottom:16px"><i id="cdbar" style="width:${cdPct.toFixed(0)}%"></i></div>
    <button class="tapbtn" id="tapbtn" onclick="doTap()" ${held()>=storeCap()||S.searchCd>0?'disabled':''}>${
      held()>=storeCap()?'Your hands are full':S.searchCd>0?'\u2026':'Turn something up'}</button>
    <div class="finds" id="finds">${S.lastFind||'&nbsp;'}</div>
    <div class="cooldown" id="cdtxt">${S.searchCd>0?Math.ceil(S.searchCd/1000*10)/10+'s':'ready'}</div></div>`;}
  h+='<h2>Things you have to hand</h2>'+shelfHTML(null,true);
  return h;}

function pageWork(){
  if(!roomsWith('work').length)
    return `<h1>No workshop</h1><p class="sub">Set one of your rooms to be a workshop and come back.
      Until then there is nowhere to put anything down.</p>`;
  const N=combineN();
  const allStacks=Object.keys(S.shelf).filter(id=>S.shelf[id]>=N&&parseId(id).p<5);
  const filt=S.workFilter;
  const stacks=allStacks.filter(id=>filt==='all'||('t'+parseId(id).p)===filt)
    .sort((a,b)=>parseId(b).p-parseId(a).p);
  const tierSet=[...new Set(allStacks.map(id=>parseId(id).p))].sort();

  let h=`<h1>The workshop</h1>
    <h2>Combine &mdash; ${N} of the same into one better</h2>
    <p class="note-p">What comes out keeps everything it was and gains one more property. When the input
    still has properties you haven\u2019t worked out, combining reveals them.</p>`;

  if(tierSet.length>1){
    h+='<div class="filt"><span style="font-family:var(--sans);font-size:11px;color:var(--dim);padding:5px 3px">Show</span>';
    h+=`<button class="${filt==='all'?'on':''}" onclick="setFilt('all')">all</button>`;
    tierSet.forEach(t=>{h+=`<button class="${filt==='t'+t?'on':''}" onclick="setFilt('t${t}')">${POT[t].lab}</button>`;});
    h+='</div>';}

  h+=stacks.length?stacks.map(id=>{
    const it=item(id),{b,p}=parseId(id),out=item(b+'@'+(p+1));
    const gain=extraTags(b,p+1).slice(-1)[0];
    const have=S.shelf[id], maxBatches=Math.floor(have/N);
    return `<div class="stack" data-id="${id}">
      <div class="l">${cap(it.name)} <small>you have ${have} \u00b7 unknowns will reveal</small></div>
      <div class="arrow">${N} &rarr;</div>
      <div class="l" style="color:var(${out.col})">${cap(out.name)} <small>gains ${gain}</small></div>
      <div class="qbox">
        <button onclick="qty('${id}',-1)">\u2212</button>
        <input id="q_${id}" type="number" min="1" max="${maxBatches}" value="1" onchange="qtySet('${id}',this.value)">
        <button onclick="qty('${id}',1)">+</button>
      </div>
      <button class="go" onclick="doCombine('${id}')">Combine</button></div>`;}).join('')
    : '<p class="empty-txt">Nothing you have '+N+' of yet.</p>';

  h+=`<h2>Transmute &mdash; four different things into one other thing</h2>
    <p class="note-p">The result shares a property with what you fed in. Which one it turns out to be
    is not up to you. ${S.transSel.length}/4 chosen.</p>`;
  h+=`<div class="shelf">${Object.keys(S.shelf).filter(i=>S.shelf[i]>0).map(id=>{
    const it=item(id),on=S.transSel.includes(id);
    return `<button class="mat ${on?'sel':''}" style="border-left-color:var(${it.col})" onclick="toggleTrans('${id}')">
      ${cap(it.name)} <span class="n">${S.shelf[id]}</span><span class="tags">${tagStr(id)}</span></button>`;}).join('')
    ||'<span class="empty-txt">Nothing to work with.</span>'}</div>
    <div style="margin-top:14px"><button class="go" onclick="doTrans()" ${
      S.transSel.length===4?'':'disabled'}>Transmute</button>
      ${S.transSel.length?'<button class="ghost" onclick="clearTrans()">Clear</button>':''}</div>`;
  return h;}

/* Home tab (was Tower). Shows rooms grouped by floor, tier upgrade offer. */
function pageTower(){
  const t=tier();
  const nx=nextTier();
  let h=`<h1>${t.pageTitle}</h1><p class="sub">${S.rooms.length} of ${roomCap()} rooms across ${t.floors} floor${t.floors===1?'':'s'} \u2014
    ${t.roomsPerFloor} per floor. Holding ${held()} of ${storeCap()}.
    Change what any room is for whenever you like.</p>`;

  if(S.tierOffered && nx){
    h+=`<div class="card" style="border-color:var(--candle)">
      <div class="t">The builder\u2019s offer <span>${nx.coin}c</span></div>
      <div class="note-p" style="margin:0 0 10px">${nx.rumour} If you pay for it, this becomes a ${nx.name} \u2014 ${nx.floors} floors, ${nx.roomsPerFloor} rooms each.</div>
      <button class="go" onclick="commissionTier()" ${S.coin<nx.coin?'disabled':''}>Commission the ${nx.name}</button></div>`;
  } else if(nx){
    h+=`<div class="card" style="opacity:.6"><div class="t">The next thing <span>needs ${nx.reqRep} renown</span></div>
      <div class="note-p" style="margin:0">A builder won\u2019t take work for someone unknown. Word has to reach them first.</div></div>`;
  }

  /* Group rooms by floor. */
  for(let f=0;f<t.floors;f++){
    const onFloor=S.rooms.filter(r=>r.floor===f);
    h+=`<div class="floor"><div class="fh"><b>Floor ${f+1}</b><span>${onFloor.length} of ${t.roomsPerFloor}</span></div>`;
    h+='<div class="rgrid">';
    h+=onFloor.map(r=>{
      const ix=S.rooms.indexOf(r);
      const fits=Object.keys(FIXTURES).filter(fx=>FIXTURES[fx].fits.includes(r.fn)&&(S.ups.includes(fx)||r.fixture===fx));
      let inner=`<div class="rh">Room</div>
        <select onchange="setRoom(${ix},this.value)">${Object.entries(ROOM_FN).map(([k,v])=>
          `<option value="${k}" ${r.fn===k?'selected':''}>${v.name}</option>`).join('')}</select>
        <div class="eff">${ROOM_FN[r.fn].desc}</div>`;
      if(r.fn==='garden'){inner+=`<select onchange="sow(${ix},this.value)" style="margin-top:6px">
        <option value="">\u2014 sow nothing \u2014</option>${BASE.filter(m=>m.sow).map(m=>
        `<option value="${m.id}" ${r.sown===m.id?'selected':''}>${cap(m.name)}</option>`).join('')}</select>`;
        if(r.sown)inner+=`<div class="bar" style="margin-top:6px"><i style="width:${(r.grown/T.grow*100).toFixed(1)}%"></i></div>`;}
      if(fits.length)inner+=`<select onchange="setFix(${ix},this.value)" style="margin-top:6px">
        <option value="">\u2014 no fixture \u2014</option>${fits.map(fx=>
        `<option value="${fx}" ${r.fixture===fx?'selected':''}>${FIXTURES[fx].name}</option>`).join('')}</select>`;
      return `<div class="room">${inner}</div>`;}).join('');
    h+='</div></div>';
  }

  const canBuild=S.rooms.length<roomCap();
  h+=`<p style="font-family:var(--sans);font-size:12px;color:var(--dim);margin-top:10px">
    New rooms are commissioned at the builder in Town.${canBuild?'':' The '+t.name+' is full. Commission the '+(nx?nx.name:'next tier')+' to build more.'}</p>`;
  return h;}

/* Town — replaces Books tab. Bookseller + builder for now. */
function pageTown(){
  let h=`<h1>Town</h1><p class="sub">The road down takes an hour, but it never seems to.
    You come back with what you came for and no memory of the walk.</p>`;
  h+='<h2>The bookseller</h2>';
  const real=BOOKS.filter(b=>b.cost>0&&!S.owned.includes(b.id));
  h+=real.map(b=>`<button class="item buy" onclick="buy('${b.id}')" ${S.coin<b.cost?'disabled':''}>
    <span class="price ${S.coin<b.cost?'no':''}">${b.cost}c</span>${b.title}
    <span>${b.kind} &middot; ${b.min} minutes</span></button>`).join('')||'<p class="empty-txt">He has nothing left you want.</p>';
  h+='<h2>Whatever else is in the cart</h2>';
  h+=SHOP_PROC.map(b=>`<button class="item buy" onclick="buyProc('${b.id}')" ${S.coin<b.cost?'disabled':''}>
    <span class="price ${S.coin<b.cost?'no':''}">${b.cost}c</span>${b.title}
    <span>common &middot; ${b.min} minutes &middot; a thought, perhaps</span></button>`).join('');

  h+='<h2>The builder</h2>';
  const cap=roomCap(), used=S.rooms.length, room=cap-used;
  if(room>0){
    /* Room cost scales with how many you already have this tier. */
    const t=tier();
    const roomCost=Math.round(20*Math.pow(1.35,used-1));
    h+=`<button class="item buy" onclick="commissionRoom()" ${S.coin<roomCost?'disabled':''}>
      <span class="price ${S.coin<roomCost?'no':''}">${roomCost}c</span>Another room in the ${t.name}
      <span>Room for ${room} more before the ${t.name} is full. Placed on the lowest floor with space.</span></button>`;
  } else {
    h+='<p class="empty-txt">The '+tier().name+' is at its full size. The builder shrugs.</p>';
  }
  const nx=nextTier();
  if(S.tierOffered && nx){
    h+=`<button class="item buy" onclick="commissionTier()" ${S.coin<nx.coin?'disabled':''}>
      <span class="price ${S.coin<nx.coin?'no':''}">${nx.coin}c</span>Raise the ${nx.name}
      <span>${nx.floors} floors, ${nx.roomsPerFloor} rooms each. The stair goes up further than it did.</span></button>`;
  }
  h+='<h2>Fixtures &mdash; ironmonger</h2>';
  h+=Object.entries(FIXTURES).filter(([k])=>!S.ups.includes(k)).map(([k,f])=>
    `<button class="item buy" onclick="buyFix('${k}')" ${S.coin<f.cost?'disabled':''}>
      <span class="price ${S.coin<f.cost?'no':''}">${f.cost}c</span>${f.name}
      <span>${f.desc} &middot; goes in a ${f.fits.map(x=>ROOM_FN[x].name.toLowerCase().replace(/^a\s+|^an\s+/, '')).join(' or ')}</span></button>`).join('')
    ||'<p class="empty-txt">You own every fixture.</p>';
  return h;}

/* Notebook — now with reading track, inline study buttons, current-study card. */
function pageNote(){
  const done=BASE.filter(m=>(S.lore[m.id]||[]).length===m.tags.length).length;
  let h=`<h1>The notebook</h1><p class="sub">Everything you have worked out. None of it was given to you.</p>`;

  /* Reading — was Books tab, lives here. */
  h+='<h2>Under your arm</h2>';
  if(S.activeBook){const b=bk(S.activeBook),d=readMin(b)*MIN;
    h+=`<div class="card"><div class="t">${b.title}<span id="bookleft">${mins(d-S.bookProg)} left</span></div>
      <div class="bar"><i id="bookbar" style="width:${(S.bookProg/d*100).toFixed(1)}%"></i></div>
      <div style="margin-top:10px"><button class="ghost" style="margin:0" onclick="setBook(null)">Put it down</button></div></div>`;
  } else h+='<p class="empty-txt">You are carrying nothing to read.</p>';
  const unread=S.owned.filter(id=>!S.readBooks.includes(id)&&id!==S.activeBook);
  if(unread.length){
    h+='<div class="filt" style="margin-top:8px">'+unread.map(id=>{const b=bk(id);
      return `<button onclick="setBook('${id}')">Pick up: ${b.title}</button>`;}).join('')+'</div>';
  }

  /* Current study card. */
  if(S.doing){const d=S.doing;
    if(d.kind==='study'){const it=item(d.target),k=knownTags(d.target);
      h+=`<div class="study-now"><div class="t">Studying &mdash; ${mins(d.dur-d.elapsed)} left</div>
        <div class="n">${cap(it.name)}</div>
        <div class="props">${it.tags.map(t=>k.includes(t)?`<b>${t}</b>`:`<i>?</i>`).join(' \u00b7 ')}</div>
        <div class="bar" id="occbar-wrap"><i id="occbar" style="width:${(d.elapsed/d.dur*100).toFixed(1)}%"></i></div>
        <div style="margin-top:10px"><button class="ghost" style="margin:0" onclick="stopOcc()">Stop</button></div></div>`;
    } else {
      h+=`<div class="study-now"><div class="t">Sitting and thinking &mdash; ${mins(d.dur-d.elapsed)} left</div>
        <div class="bar"><i id="occbar" style="width:${(d.elapsed/d.dur*100).toFixed(1)}%"></i></div>
        <div style="margin-top:10px"><button class="ghost" style="margin:0" onclick="stopOcc()">Stop</button></div></div>`;
    }
  }

  h+=`<div class="nb"><div class="grp">What troubles people &mdash; ${S.troubles.length} of ${Object.keys(TROUBLES).length}</div>`;
  h+=Object.entries(TROUBLES).map(([k,v])=>knows(k)?`<div class="lore">${v.lore}</div>`
    :`<div class="lore un">${v.label} &mdash; you have not read about this.</div>`).join('');
  h+=`<div class="grp">What things do &mdash; ${done} of ${BASE.length}</div>`;
  /* Inline study buttons per material. */
  h+=BASE.map(m=>{const k=S.lore[m.id]||[];
    const have=S.shelf[m.id]||0;
    const canStudy=have>0 && k.length<m.tags.length && !S.doing;
    const isStudying=S.doing && S.doing.kind==='study' && S.doing.target===m.id;
    return `<div class="row ${k.length?'':'un'}">
      <span>${cap(m.name)}${isStudying?' <em style="color:var(--sky);font-style:normal;font-family:var(--sans);font-size:10px">&middot; studying</em>':''}</span>
      <span class="v">${k.length?m.tags.map(t=>k.includes(t)?t:'?').join(' \u00b7 '):'unknown'}</span>
      ${k.length<m.tags.length?`<button class="study-btn" onclick="startStudy('${m.id}')" ${canStudy?'':'disabled'} title="${have?(S.doing?'Busy':'Study for '+mins(T.study)):'You have none to study'}">study</button>`:''}
    </div>`;}).join('');
  h+='</div>';

  h+=`<h2>Sit and think</h2>`;
  if(!S.doing){
    h+=`<button class="place" style="max-width:340px" onclick="startPonder()" ${S.troubles.length<3?'disabled style="opacity:.4"':''}>
      <b>Sit and think</b><span>${mins(T.ponder)} &middot; +3 insight${S.troubles.length<3?' &middot; you need more in your head first':''}</span></button>`;
  } else {
    h+='<p class="empty-txt">You are already occupied.</p>';
  }
  return h;}

function pageSelf(){
  let h=`<h1>Yourself</h1><h2>What they call you</h2>
    <input class="nm" id="nmin" value="${S.name.replace(/"/g,'&quot;')}" placeholder="Name yourself" oninput="setName(this.value)">
    <h2>What you are wearing</h2><div class="grid2">`;
  h+=Object.keys(KIT).map(k=>`<div class="sl"><b>${SLOTNAME[k]}</b>
    <select onchange="setKit('${k}',this.value)">${KIT[k].map(([v,n])=>
      `<option value="${v}" ${S.kit[k]===v?'selected':''}>${n}</option>`).join('')}</select></div>`).join('');
  h+='</div>';
  if(S.kit.lhand==='orb')h+='<p style="font-size:14px;color:var(--violet);margin-top:14px">The orb answers one question a caller, free. It is glass. You know it is glass.</p>';
  h+='<h2>What people say about you</h2>';
  h+=S.rumours.length?S.rumours.map(r=>`<div class="rum"><div class="t">${r.name}</div>
    <div class="d">${r.drift}</div><div class="m">${TROUBLES[r.trouble].label.toLowerCase()} &middot; made from ${r.from}</div></div>`).join('')
    +'<p style="font-family:var(--sans);font-size:11px;color:var(--dim);margin-top:14px">What you are known for decides who climbs the stairs.</p>'
    :'<p class="empty-txt">Nobody has anything to say about you yet.</p>';
  return h;}

/* ---------- shared fragments ---------- */
function tagStr(id){const it=item(id),k=knownTags(id),rev=revealed();
  return it.tags.map(t=>!k.includes(t)?'<i>?</i>':(rev.includes(t)?`<b>${t}</b>`:t)).join(' \u00b7 ');}
function shelfHTML(onclickFn,disabled){
  const ids=Object.keys(S.shelf).filter(i=>S.shelf[i]>0)
    .sort((a,b)=>parseId(b).p-parseId(a).p||item(a).name.localeCompare(item(b).name));
  return `<div class="shelf" id="shelfbox">${ids.map(id=>{const it=item(id);
    return `<button class="mat ${knownTags(id).length<it.tags.length?'unknown':''}"
      style="border-left-color:var(${it.col})" ${onclickFn?`onclick="${onclickFn(id)}"`:''}
      ${disabled||!onclickFn?'disabled':''}>${cap(it.name)}
      <span class="n">${S.shelf[id]}</span><span class="tags">${tagStr(id)}</span></button>`;}).join('')
    ||'<span class="empty-txt">Nothing but dust. Go and search somewhere.</span>'}
    <div class="legend" style="width:100%">${POT.map(p=>
      `<span><i style="background:var(${p.c})"></i>${p.lab}</span>`).join('')}</div></div>`;}
function outcomeHTML(){
  if(!S.outcome)return '';const o=S.outcome;
  return `<div class="outcome ${o.cls}"><button class="x" onclick="clearOutcome()">&times;</button>
    ${o.name?`<p class="named">${o.name}</p>`:''}<p>${o.line}</p>
    <p class="gain">${o.detail}</p>${o.gained?`<p class="learned">You noticed: ${o.gained}.</p>`:''}</div>`;}

/* ---------- render ---------- */
let DIRTY=true;
const dirty=()=>{DIRTY=true;};
function renderAll(){
  drawStatus();
  $('page').innerHTML=({door:pageDoor,search:pageSearch,work:pageWork,tower:pageTower,
    town:pageTown,note:pageNote,self:pageSelf})[S.page]();
  DIRTY=false;}
function renderTick(){
  drawStatus();
  if(S.page==='note'&&S.activeBook){const b=bk(S.activeBook),d=readMin(b)*MIN;
    const bar=$('bookbar'),lf=$('bookleft');
    if(bar)bar.style.width=(S.bookProg/d*100).toFixed(1)+'%';
    if(lf)lf.textContent=mins(d-S.bookProg)+' left';}
  if(S.page==='note'&&S.doing){const bar=$('occbar');
    if(bar)bar.style.width=(S.doing.elapsed/S.doing.dur*100).toFixed(1)+'%';}
  if(S.page==='search'){
    const bar=$('cdbar'),txt=$('cdtxt'),btn=$('tapbtn');
    if(bar){const pct=S.searchCd>0?(1-S.searchCd/SEARCH_CD_MS)*100:100;bar.style.width=pct.toFixed(0)+'%';}
    if(txt)txt.textContent=S.searchCd>0?Math.ceil(S.searchCd/1000*10)/10+'s':'ready';
    if(btn && S.searchAt){
      const full=held()>=storeCap();
      const ready=S.searchCd<=0 && !full;
      btn.disabled=!ready;
      btn.textContent=full?'Your hands are full':S.searchCd>0?'\u2026':'Turn something up';
    }
  }
  /* Rooms have grow bars too. */
  if(S.page==='tower'){
    S.rooms.forEach((r,i)=>{if(r.fn==='garden'&&r.sown){
      /* No id on grow bars; skip live tick for now — full render on room change is fine. */}});
  }
}

/* ---------- actions ---------- */
window.go=p=>{S.page=p;dirty();renderAll();};
window.setSpeed=v=>{S.speed=v;drawStatus();};
window.setName=v=>{S.name=v;drawStatus();};

window.setFilt=v=>{S.workFilter=v;renderAll();};

/* Search — one click, cooldown gates the next. No shelf redraw per tap. */
window.doTap=()=>{
  if(!S.searchAt||held()>=storeCap()||S.searchCd>0)return;
  const p=PLACES.find(x=>x.id===S.searchAt);
  const id=pick(p.mats);
  give(id);
  S.lastFind=`You turn up <b>${item(id).name}</b>.`;
  note(`Found ${item(id).name} at ${p.name}.`);
  S.searchCd=SEARCH_CD_MS;
  /* Update find text and disable button now; shelf refreshes on next render tick when convenient. */
  const f=$('finds');if(f)f.innerHTML=S.lastFind;
  const btn=$('tapbtn');if(btn){btn.disabled=true;btn.textContent=held()>=storeCap()?'Your hands are full':'\u2026';}
  const bar=$('cdbar');if(bar)bar.style.width='0%';
  /* Full re-render deferred a hair so tap feels snappy but shelf updates. */
  setTimeout(()=>{dirty();renderAll();},50);
};
window.setPlace=id=>{S.searchAt=S.searchAt===id?null:id;S.lastFind='';S.searchCd=0;dirty();renderAll();};

window.setBook=id=>{if(id&&S.readBooks.includes(id))return;S.activeBook=id;S.bookProg=0;renderAll();};
window.startStudy=id=>{if(S.doing)return;if(!(S.shelf[id]>0))return;S.doing={kind:'study',target:id,elapsed:0,dur:T.study};renderAll();};
window.startPonder=()=>{if(S.doing)return;S.doing={kind:'ponder',target:null,elapsed:0,dur:T.ponder};renderAll();};
window.stopOcc=()=>{S.doing=null;renderAll();};

window.setRoom=(i,v)=>{const r=S.rooms[i];r.fn=v;
  if(r.fixture&&!FIXTURES[r.fixture].fits.includes(v))r.fixture=null;
  if(v!=='garden'){r.sown=null;r.grown=0;}renderAll();};
window.setFix=(i,v)=>{S.rooms.forEach(r=>{if(r.fixture===v)r.fixture=null;});S.rooms[i].fixture=v||null;renderAll();};
window.sow=(i,v)=>{S.rooms[i].sown=v||null;S.rooms[i].grown=0;renderAll();};
window.setKit=(k,v)=>{S.kit[k]=v;renderAll();};

/* Room commission (builder in Town). Places on lowest floor with space. */
window.commissionRoom=()=>{
  const cap=roomCap();if(S.rooms.length>=cap)return;
  const used=S.rooms.length;
  const roomCost=Math.round(20*Math.pow(1.35,used-1));
  if(S.coin<roomCost)return;
  const t=tier();
  let placedFloor=0;
  for(let f=0;f<t.floors;f++){
    if(S.rooms.filter(r=>r.floor===f).length<t.roomsPerFloor){placedFloor=f;break;}
  }
  S.coin-=roomCost;
  S.rooms.push({floor:placedFloor,fn:'empty',fixture:null,sown:null,grown:0});
  note(`The builder raises another room on floor ${placedFloor+1}. Wood-smell for a week.`);
  renderAll();
};
window.commissionTier=()=>{
  const nx=nextTier();if(!nx)return;
  if(!S.tierOffered)return;
  if(S.coin<nx.coin)return;
  S.coin-=nx.coin;
  S.tierIx++;S.tierOffered=false;
  /* Rooms keep their floor index; the tier just permits more of them and more floors. */
  note(`The work is done. Your ${tier().name} rises where the old ${TIERS_UP[S.tierIx-1].name} stood. The stair goes up further than it did.`);
  renderAll();
};

/* Combine — with batch quantity. Reveals unknown input properties on the way. */
window.qty=(id,d)=>{const el=$('q_'+id);if(!el)return;
  const have=S.shelf[id]||0,max=Math.floor(have/combineN());
  let v=parseInt(el.value)||1;v=Math.max(1,Math.min(max,v+d));el.value=v;};
window.qtySet=(id,v)=>{const el=$('q_'+id);if(!el)return;
  const have=S.shelf[id]||0,max=Math.floor(have/combineN());
  let n=parseInt(v)||1;n=Math.max(1,Math.min(max,n));el.value=n;};
window.doCombine=id=>{
  const N=combineN();const el=$('q_'+id);const batches=el?Math.max(1,parseInt(el.value)||1):1;
  const{b,p}=parseId(id);if(p>=5)return;
  const have=S.shelf[id]||0;const canDo=Math.min(batches,Math.floor(have/N));
  if(canDo<=0)return;
  /* Reveal unknown properties of the input mat (one at a time per batch, up to available). */
  const it=item(id);
  const un=it.tags.filter(t=>!knownTags(id).includes(t));
  const revealCount=Math.min(un.length,canDo);
  if(revealCount){
    const revealed=un.slice(0,revealCount);
    S.lore[b]=[...knownTags(id),...revealed];
    note(`Working with the ${it.name}, you notice: ${revealed.join(', ')}.`);
  }
  S.shelf[id]-=N*canDo;if(!S.shelf[id])delete S.shelf[id];
  const out=b+'@'+(p+1);S.shelf[out]=(S.shelf[out]||0)+canDo;
  note(`${N*canDo} become ${canDo}. You have ${canDo}\u00d7 ${item(out).name}.`);
  renderAll();
};
window.toggleTrans=id=>{
  if(S.transSel.includes(id))S.transSel=S.transSel.filter(x=>x!==id);
  else if(S.transSel.length<4&&!S.transSel.some(x=>parseId(x).b===parseId(id).b))S.transSel.push(id);
  renderAll();};
window.clearTrans=()=>{S.transSel=[];renderAll();};
window.doTrans=()=>{
  if(S.transSel.length!==4)return;
  const tags=new Set();S.transSel.forEach(x=>item(x).tags.forEach(t=>tags.add(t)));
  S.transSel.forEach(x=>{S.shelf[x]--;if(!S.shelf[x])delete S.shelf[x];});
  const used=new Set(S.transSel.map(x=>parseId(x).b));
  let pool=BASE.filter(m=>!used.has(m.id)&&m.tags.some(t=>tags.has(t)));
  if(!pool.length)pool=BASE;
  const out=pick(pool).id;S.shelf[out]=(S.shelf[out]||0)+1;
  note(`Four become one. The workshop gives you back ${item(out).name}.`);
  S.transSel=[];renderAll();};

window.buy=id=>{const b=BOOKS.find(x=>x.id===id);if(S.coin<b.cost)return;
  S.coin-=b.cost;S.owned.push(id);note(`You buy ${b.title}.`);renderAll();};
window.buyProc=id=>{const b=S.procBooks[id];if(S.coin<b.cost)return;
  S.coin-=b.cost;S.owned.push(id);SHOP_PROC=SHOP_PROC.filter(x=>x.id!==id);SHOP_PROC.push(makeProcBook());
  note(`You buy ${b.title}. It is probably rubbish.`);renderAll();};
window.buyFix=k=>{const f=FIXTURES[k];if(S.coin<f.cost)return;S.coin-=f.cost;S.ups.push(k);
  note(`${f.name}. Now put it somewhere.`);renderAll();};

window.place=id=>{if(S.bench.length>=3||!S.shelf[id])return;
  S.shelf[id]--;if(!S.shelf[id])delete S.shelf[id];S.bench.push(id);renderAll();};
window.unplace=i=>{const id=S.bench.splice(i,1)[0];S.shelf[id]=(S.shelf[id]||0)+1;renderAll();};
window.clearBench=()=>{S.bench.forEach(id=>S.shelf[id]=(S.shelf[id]||0)+1);S.bench=[];renderAll();};
window.clearOutcome=()=>{S.outcome=null;renderAll();};
window.clearLog=()=>{S.log=[];renderAll();};

window.autofill=()=>{
  S.bench.forEach(id=>S.shelf[id]=(S.shelf[id]||0)+1);S.bench=[];
  const rev=revealed();if(!rev.length){renderAll();return;}
  const ids=Object.keys(S.shelf).filter(id=>S.shelf[id]>0);
  const sc=id=>rev.filter(n=>knownTags(id).includes(n)).length;
  ids.sort((a,b)=>sc(b)-sc(a));
  const covered=new Set();
  for(const id of ids){
    if(S.bench.length>=3)break;
    const adds=rev.filter(n=>knownTags(id).includes(n)&&!covered.has(n));
    if(!adds.length)continue;
    S.shelf[id]--;if(!S.shelf[id])delete S.shelf[id];S.bench.push(id);
    adds.forEach(n=>covered.add(n));
    if(covered.size===rev.length)break;}
  renderAll();};

function revealOne(){const rev=revealed(),miss=needsOf().filter(n=>!rev.includes(n));
  if(!miss.length)return null;S.asked.push('n'+needsOf().indexOf(miss[0]));return miss[0];}
window.intuit=()=>{if(S.insight<INTUIT_COST)return;const n=revealOne();if(!n)return;
  S.insight-=INTUIT_COST;S.said.push(`You have seen this before, or something like it. It wants <b>${n}</b>.`);renderAll();};
window.orb=()=>{if(S.orbUsed)return;const n=revealOne();if(!n)return;S.orbUsed=true;
  S.said.push(`You make a show of the orb. Looking into it, you happen to notice they want <b>${n}</b>. The glass had nothing to do with it.`);renderAll();};

window.ask=q=>{
  if(leftAct()<=0||S.asked.includes(q))return;
  S.asked.push(q);S.used++;
  const sp=S.supplicant,needs=needsOf();
  if(q==='n0')S.said.push(sp.when);
  if(q==='n1')S.said.push(`You look properly. What it wants is <b>${needs[1]}</b>, and you would have missed it.`);
  if(q==='tried'){const dud=BASE.filter(m=>!m.tags.some(t=>needs.includes(t)));
    const m=pick(dud.length?dud:BASE);S.lore[m.id]=[...m.tags];
    S.said.push(`${sp.tried} ${m.name}. It did nothing \u2014 but you have handled it now, and you know what it is.`);}
  renderAll();};

window.turnAway=()=>{
  if(!S.supplicant)return;
  const sp=S.supplicant;
  const lost=Math.max(0,Math.min(S.rep,1));
  S.rep-=lost;
  S.bench.forEach(id=>S.shelf[id]=(S.shelf[id]||0)+1);S.bench=[];
  S.outcome={cls:'turned',name:null,
    line:`You do not open the door. ${sp.who} waits, then goes back down the stair.`,
    detail:`\u22121 renown. Word travels. It is not the good kind.`,gained:''};
  note(`You turned ${sp.keeps} away. \u22121 renown.`);
  S.supplicant=null;S.used=0;S.asked=[];S.said=[];S.orbUsed=false;
  S.knockIn=callerWait();
  renderAll();
};

window.answer=()=>{
  const used=[...S.bench],names=used.map(id=>item(id).name);
  const needs=needsOf(),tags=benchTags(),sp=S.supplicant;
  const met=needs.filter(n=>tags.has(n));
  let score=met.length;
  if(met.length===needs.length)score+=[0,2,1,0][used.length];
  score=Math.max(0,Math.min(5,score+[2,1,0,-1,-1][S.used]));
  const t=pick(POOLS[score]);
  const gained=[];
  used.forEach(id=>{const it=item(id);it.tags.forEach(tt=>{
    if(needs.includes(tt)&&!knownTags(id).includes(tt)){S.lore[it.b]=[...knownTags(id),tt];gained.push(`${it.name} is ${tt}`);}});});
  S.rep+=TIERS_ANS[t].rep;S.coin+=TIERS_ANS[t].coin;
  let name=null;
  if(t==='remembered'){name=`The ${cap(sp.keeps)}\u2019s ${NOUN[parseId(pick(used)).b]}`;
    S.rumours.unshift({name,trouble:sp.trouble,from:names.join(', '),drift:pick(DRIFT)});}
  const missed=needs.filter(n=>!met.includes(n));
  S.outcome={cls:TIERS_ANS[t].cls,name,line:pick(REACTION[t]),
    detail:`It wanted <b>${needs.join(', ')}</b>. You gave ${met.length?met.join(' and '):'none of it'}${
      missed.length?`, and missed ${missed.join(' and ')}`:''}, using ${used.length} thing${used.length===1?'':'s'} and ${
      S.used} action${S.used===1?'':'s'}. ${TIERS_ANS[t].rep?`+${TIERS_ANS[t].rep} renown, +${TIERS_ANS[t].coin} coin.`:'Nothing gained.'}`,
    gained:gained.join('; ')};
  note(name?`${name}. +${TIERS_ANS[t].rep} renown.`:`The ${sp.keeps}: ${t}. +${TIERS_ANS[t].rep} renown.`);
  S.bench=[];S.supplicant=null;S.used=0;S.asked=[];S.said=[];S.orbUsed=false;
  S.knockIn=callerWait();renderAll();};

/* ---------- character creator ---------- */
let CREATE={name:'',location:null,kit:{head:'none',body:'none',legs:'none',lhand:'none',rhand:'none',feet:'none'},curio:null};

function drawCreator(){
  const c=CREATE;
  const locChosen=START_LOCATIONS.find(l=>l.id===c.location);
  const madlibLine=locChosen && c.name && c.curio
    ? `${c.name}, ${kitDescriptorFor(c.kit)}, arriving at ${locChosen.name} with ${CURIOS.find(x=>x.id===c.curio).name.toLowerCase()}.`
    : 'Fill in the pieces below.';
  let h=`<div class="in">
    <h1>Before we begin</h1>
    <p class="lede">You wake in a shack you do not remember arriving at. Some things are already true of you.</p>

    <h2>Your name</h2>
    <input class="nm" placeholder="What they will call you" value="${c.name.replace(/"/g,'&quot;')}" oninput="createSet('name',this.value)">

    <h2>Where the shack stands</h2>
    ${START_LOCATIONS.map(l=>`<button class="loc ${c.location===l.id?'on':''}" onclick="createSet('location','${l.id}')">
      <b>${cap(l.name)}</b>${l.flavour}
      <span>Nearby: ${l.places.map(p=>PLACES.find(x=>x.id===p).name).join(' \u00b7 ')}</span></button>`).join('')}

    <h2>What you look like</h2>
    <div class="grid2">${Object.keys(KIT).map(k=>`<div class="sl"><b>${SLOTNAME[k]}</b>
      <select onchange="createKit('${k}',this.value)">${KIT[k].map(([v,n])=>
        `<option value="${v}" ${c.kit[k]===v?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}</div>

    <h2>You look around the shack and find\u2026</h2>
    ${CURIOS.map(cu=>`<button class="loc ${c.curio===cu.id?'on':''}" onclick="createSet('curio','${cu.id}')">
      <b>${cu.name}</b>${cu.desc}</button>`).join('')}

    <div class="summary">${madlibLine}</div>

    <button class="go begin" onclick="beginGame()" ${(c.name&&c.location&&c.curio)?'':'disabled'}>Open your eyes</button>
  </div>`;
  $('creator-mount').innerHTML=h;
}
function kitDescriptorFor(kit){
  const parts=[];
  const HEAD_ADJ={hood:'hooded',hat:'hatted',cap:'capped',scarf:'scarfed',coif:'coifed',crown:'crowned'};
  if(HEAD_ADJ[kit.head])parts.push(HEAD_ADJ[kit.head]);
  parts.push('wizard');
  const held=[];
  const HAND_N={stick:'walking stick',staff:'knotted staff',orb:'scrying orb',censer:'small censer',book:'closed book',
                pen:'pen',knife:'small knife',wand:'wand-shaped stick',bell:'hand-bell',pouch:'leather pouch'};
  if(HAND_N[kit.lhand])held.push(HAND_N[kit.lhand]);
  if(HAND_N[kit.rhand])held.push(HAND_N[kit.rhand]);
  let out='the '+parts.join(' ');
  const art=w=>/^[aeiou]/i.test(w)?'an '+w:'a '+w;
  if(held.length)out+=' with '+held.map(art).join(' and ');
  return out;
}
window.createSet=(k,v)=>{CREATE[k]=v;drawCreator();};
window.createKit=(k,v)=>{CREATE.kit[k]=v;drawCreator();};
window.beginGame=()=>{
  if(!(CREATE.name&&CREATE.location&&CREATE.curio))return;
  S.name=CREATE.name.trim();
  S.location=CREATE.location;
  S.kit={...CREATE.kit};
  const loc=START_LOCATIONS.find(l=>l.id===CREATE.location);
  loc.startShelf.forEach(id=>{S.shelf[id]=(S.shelf[id]||0)+1;});
  S.lore={...loc.startLore};
  const cu=CURIOS.find(c=>c.id===CREATE.curio);
  if(cu.kind==='mat'){S.shelf[cu.val]=(S.shelf[cu.val]||0)+1;S.lore[cu.val]=[...BASE.find(m=>m.id===cu.val).tags];}
  if(cu.kind==='book'){if(!S.owned.includes(cu.val))S.owned.push(cu.val);}
  if(cu.kind==='kit'){S.kit[cu.slot]=cu.val;}
  S.setup=true;
  S.log=[`You wake at ${loc.name}. A shack with one room. You do not remember arriving.`];
  SHOP_PROC=[makeProcBook(),makeProcBook(),makeProcBook()];
  $('creator-mount').style.display='none';
  $('stbar').hidden=false;
  $('page').hidden=false;
  renderAll();
};

/* ---------- boot ---------- */
function boot(){
  if(!S.setup){drawCreator();}
  else{$('creator-mount').style.display='none';$('stbar').hidden=false;$('page').hidden=false;renderAll();}
  setInterval(()=>{
    if(!S.setup)return;
    const n=Date.now();simulate(S,n-S.lastUpdate);S.lastUpdate=n;
    if(DIRTY)renderAll();else renderTick();
  },500);
}
boot();
</script>
